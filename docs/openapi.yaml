openapi: 3.1.0
info:
  title: Mi Tierrita API
  version: 1.0.0
  description: |
    Backend REST de Mi Tierrita SIG. Todas las rutas van bajo `/api/v1` y exigen `Authorization: Bearer <token>`
    salvo `POST /auth/signin`, `GET /health` y `GET /docs`.

    Convenciones (documento 06):
    - Los listados aceptan `?page=` (base 1) y `?limit=` (10, máximo 100) y responden `{ count, page, pages, items }`.
    - Los errores responden `{ "message": "<código>" }` (tabla de códigos en el README). Los errores de validación
      (código `400`) agregan `details: [{ path, message }]`; el `613` agrega `details.requiredRoles`.
    - Roles: `ADMIN` (Administrador), `SALES` (Secretaria), `WAREHOUSE` (Bodega).
servers:
  - url: /api/v1
tags:
  - { name: Autenticación }
  - { name: Usuarios }
  - { name: Categorías }
  - { name: Productos e inventario }
  - { name: Ventas }
  - { name: Clientes y cartera }
  - { name: Proveedores }
  - { name: Finanzas }
  - { name: Auditoría }
  - { name: Búsqueda }
  - { name: Comentarios }
  - { name: Reportes }
  - { name: Chat del equipo }
  - { name: Contactos del sitio }
  - { name: Biblioteca }
  - { name: Asistente de IA }
  - { name: Alarmas y avisos }
  - { name: Calendario }
  - { name: Web Push }

paths:
  # ------------------------------------------------------------ Autenticación
  /auth/signin:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión (CU-01) — público
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: admin }
                password: { type: string, format: password }
      responses:
        "200":
          description: Token de acceso y datos básicos del usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { description: "610 credenciales inválidas · 612 usuario inactivo", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "429": { description: "640 demasiados intentos (10 por 15 minutos)", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /auth/signout:
    post:
      tags: [Autenticación]
      summary: Cerrar sesión e invalidar todos los tokens vigentes (CU-02)
      responses:
        "204": { description: Sesión cerrada }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/me:
    get:
      tags: [Autenticación]
      summary: Usuario autenticado
      responses:
        "200": { description: Usuario, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ------------------------------------------------------------ Usuarios
  /users:
    post:
      tags: [Usuarios]
      summary: Crear usuario (CU-03) — ADMIN
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateUser" } } } }
      responses:
        "201": { description: Usuario creado, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "630 usuario duplicado", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    get:
      tags: [Usuarios]
      summary: Listar usuarios — ADMIN
      parameters: [{ $ref: "#/components/parameters/page" }, { $ref: "#/components/parameters/limit" }]
      responses:
        "200": { description: Listado paginado, content: { application/json: { schema: { $ref: "#/components/schemas/UserPage" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /users/{id}:
    get:
      tags: [Usuarios]
      summary: Consultar usuario — ADMIN
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: Usuario, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "404": { description: "603 usuario no encontrado", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /users/me/password:
    put:
      tags: [Usuarios]
      summary: Cambiar contraseña propia (CU-04)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 8 }
      responses:
        "204": { description: Contraseña actualizada }
        "401": { description: "610 contraseña actual incorrecta", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }

  /users/me:
    put:
      tags: [Usuarios]
      summary: Actualizar mi perfil (nombre, correo, teléfono) — cualquier rol
      description: Enviar null o "" en email o phone los borra. El usuario y el rol solo los cambia el administrador.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName: { type: string, maxLength: 80 }
                lastName: { type: string, maxLength: 80 }
                email: { type: [string, "null"], format: email, maxLength: 120 }
                phone: { type: [string, "null"], maxLength: 30 }
      responses:
        "200": { description: Perfil actualizado, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/Validation" }

  /users/me/avatar:
    put:
      tags: [Usuarios]
      summary: Guardar mi foto de perfil — cualquier rol
      description: Cuerpo binario JPEG, PNG o WebP de hasta 1 MB (la app la reduce a 256×256); tipo en `Content-Type`.
      requestBody: { required: true, content: { image/jpeg: { schema: { type: string, format: binary } }, image/png: { schema: { type: string, format: binary } }, image/webp: { schema: { type: string, format: binary } } } }
      responses:
        "200": { description: Usuario con hasAvatar y avatarUpdatedAt, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Usuarios]
      summary: Quitar mi foto de perfil — cualquier rol
      responses:
        "200": { description: Usuario sin foto, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
  /users/{id}/avatar:
    get:
      tags: [Usuarios]
      summary: Foto de perfil de una persona — cualquier rol
      description: "`Cache-Control: private, max-age=300` y `ETag` derivado de `avatarUpdatedAt` (responde 304 con `If-None-Match`)."
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: La foto, content: { image/jpeg: { schema: { type: string, format: binary } }, image/png: { schema: { type: string, format: binary } }, image/webp: { schema: { type: string, format: binary } } } }
        "304": { description: Sin cambios }
        "404": { description: "603 usuario no encontrado · 691 sin foto", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }

  /users/directory:
    get:
      tags: [Usuarios]
      summary: Directorio de personas (ficha con rol, contacto y presencia) — cualquier rol
      description: >-
        Brief 2.5, punto 30. Todas las cuentas activas con rol, correo, teléfono, foto y presencia (misma regla del
        panel «Equipo» del chat: petición en los últimos 90 segundos sin cierre de sesión posterior). Solo ADMIN ve
        además las cuentas inactivas, marcadas con `active: false`.
      responses:
        "200":
          description: Personas del directorio (activas primero, luego por nombre)
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DirectoryEntry" } }

  # ------------------------------------------------------------ Categorías
  /categories:
    post:
      tags: [Categorías]
      summary: Crear categoría — ADMIN, WAREHOUSE
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 80 } } } } } }
      responses:
        "201": { description: Creada, content: { application/json: { schema: { $ref: "#/components/schemas/Category" } } } }
        "409": { description: "630 nombre duplicado", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    get:
      tags: [Categorías]
      summary: Listar categorías — autenticado
      parameters: [{ $ref: "#/components/parameters/page" }, { $ref: "#/components/parameters/limit" }, { $ref: "#/components/parameters/active" }]
      responses:
        "200": { description: Listado paginado, content: { application/json: { schema: { $ref: "#/components/schemas/CategoryPage" } } } }
  /categories/{id}:
    put:
      tags: [Categorías]
      summary: Editar o desactivar categoría — ADMIN, WAREHOUSE
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { name: { type: string, maxLength: 80 }, active: { type: boolean } } } } } }
      responses:
        "200": { description: Actualizada, content: { application/json: { schema: { $ref: "#/components/schemas/Category" } } } }
        "404": { description: "602", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    delete:
      tags: [Categorías]
      summary: Eliminar categoría sin productos — ADMIN
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "204": { description: Eliminada }
        "404": { description: "602", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "409": { description: "631 categoría con productos asociados", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }

  # ------------------------------------------------------------ Productos e inventario
  /products:
    post:
      tags: [Productos e inventario]
      summary: Registrar producto (CU-05), nace con stock 0 — ADMIN, WAREHOUSE
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateProduct" } } } }
      responses:
        "201": { description: Creado, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }
        "404": { description: "602 categoría no encontrada", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "409": { description: "630 SKU duplicado", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    get:
      tags: [Productos e inventario]
      summary: Listar productos con stock actual (RF-02.3) — autenticado
      parameters:
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/active" }
        - { name: category, in: query, schema: { type: integer }, description: Id de categoría }
        - { name: search, in: query, schema: { type: string }, description: Busca en nombre y SKU }
      responses:
        "200": { description: Listado paginado, content: { application/json: { schema: { $ref: "#/components/schemas/ProductPage" } } } }
  /products/{id}:
    get:
      tags: [Productos e inventario]
      summary: Consultar producto — autenticado
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: Producto, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }
        "404": { description: "601", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    put:
      tags: [Productos e inventario]
      summary: Editar producto — ADMIN, WAREHOUSE
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateProduct" } } } }
      responses:
        "200": { description: Actualizado, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }
        "404": { description: "601 · 602", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "409": { description: "630", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    delete:
      tags: [Productos e inventario]
      summary: Desactivar producto (conserva histórico) — ADMIN
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "204": { description: Desactivado }
        "404": { description: "601", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /products/{id}/batches:
    post:
      tags: [Productos e inventario]
      summary: Registrar lote (CU-06), sube el stock — ADMIN, WAREHOUSE
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity, expiresAt]
              properties:
                quantity: { type: integer, minimum: 1 }
                expiresAt: { type: string, format: date, example: "2026-12-31", description: "Hoy o posterior (hora de Colombia); un lote vencido responde 400" }
                unitCost: { type: number, description: Por defecto el precio de compra del producto }
                supplierId: { type: integer }
      responses:
        "201": { description: Lote creado, content: { application/json: { schema: { $ref: "#/components/schemas/ProductBatch" } } } }
        "404": { description: "601 · 605 proveedor", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "409": { description: "625 producto inactivo", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    get:
      tags: [Productos e inventario]
      summary: Lotes de un producto en orden FEFO — autenticado
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/limit" }
        - { name: onlyAvailable, in: query, schema: { type: boolean }, description: Omite lotes agotados }
      responses:
        "200": { description: Listado paginado, content: { application/json: { schema: { $ref: "#/components/schemas/ProductBatchPage" } } } }
  /batches/expiring:
    get:
      tags: [Productos e inventario]
      summary: Lotes con existencias por vencer o vencidos (CU-07) — ADMIN, WAREHOUSE
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 30 }, description: Ventana en días }
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200": { description: Ordenados por vencimiento ascendente, content: { application/json: { schema: { $ref: "#/components/schemas/ProductBatchPage" } } } }

  # ------------------------------------------------------------ Ventas
  /sales:
    post:
      tags: [Ventas]
      summary: Registrar venta (CU-09, CU-08 FEFO, CU-11 crédito) — ADMIN, SALES
      description: |
        El servidor congela el precio de venta vigente por línea, calcula el total, descuenta stock del lote
        más próximo a vencer (no vencido) y, si es a crédito, valida el cupo y sube la cartera del cliente.
        Todo ocurre en una transacción con bloqueo de fila: si algo falla no queda nada registrado.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateSale" } } } }
      responses:
        "201": { description: Venta registrada con su correlativo, content: { application/json: { schema: { $ref: "#/components/schemas/SaleDetail" } } } }
        "400": { $ref: "#/components/responses/Validation" }
        "404": { description: "601 producto · 604 cliente", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "409": { description: "620 stock insuficiente (details: productId, requested, available) · 621 cupo excedido · 625 · 626", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    get:
      tags: [Ventas]
      summary: Consultar ventas (CU-10) — ADMIN, SALES
      parameters:
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/from" }
        - { $ref: "#/components/parameters/to" }
        - { name: customerId, in: query, schema: { type: integer } }
        - { name: userId, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [COMPLETED, VOIDED] } }
      responses:
        "200": { description: Listado paginado (más recientes primero), content: { application/json: { schema: { $ref: "#/components/schemas/SalePage" } } } }
  /sales/{id}:
    get:
      tags: [Ventas]
      summary: Detalle de una venta con sus líneas — ADMIN, SALES
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: Venta, content: { application/json: { schema: { $ref: "#/components/schemas/SaleDetail" } } } }
        "404": { description: "606", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /sales/{id}/void:
    post:
      tags: [Ventas]
      summary: Anular venta devolviendo el stock a sus lotes (RF-03.4) — ADMIN
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: Venta con estado VOIDED, content: { application/json: { schema: { $ref: "#/components/schemas/SaleDetail" } } } }
        "404": { description: "606", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "409": { description: "622 ya anulada", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }

  # ------------------------------------------------------------ Clientes y cartera
  /customers:
    post:
      tags: [Clientes y cartera]
      summary: Crear cliente — ADMIN, SALES
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateCustomer" } } } }
      responses:
        "201": { description: Creado, content: { application/json: { schema: { $ref: "#/components/schemas/Customer" } } } }
        "409": { description: "630 documento duplicado", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    get:
      tags: [Clientes y cartera]
      summary: Listar clientes — ADMIN, SALES
      parameters:
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/active" }
        - { name: search, in: query, schema: { type: string }, description: Busca en nombre y documento }
        - { name: withBalance, in: query, schema: { type: boolean }, description: Solo clientes con saldo }
      responses:
        "200": { description: Listado paginado, content: { application/json: { schema: { $ref: "#/components/schemas/CustomerPage" } } } }
  /customers/{id}:
    get:
      tags: [Clientes y cartera]
      summary: Consultar cliente — ADMIN, SALES
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: Cliente, content: { application/json: { schema: { $ref: "#/components/schemas/Customer" } } } }
        "404": { description: "604", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    put:
      tags: [Clientes y cartera]
      summary: Editar cliente (datos, cupo, estado) — ADMIN, SALES
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateCustomer" } } } }
      responses:
        "200": { description: Actualizado, content: { application/json: { schema: { $ref: "#/components/schemas/Customer" } } } }
        "404": { description: "604", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /customers/{id}/balance:
    get:
      tags: [Clientes y cartera]
      summary: Saldo de cartera y cupo disponible (RF-04.4) — ADMIN, SALES
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { $ref: "#/components/parameters/overdueDays" }
      responses:
        "200": { description: Saldo, content: { application/json: { schema: { $ref: "#/components/schemas/CustomerBalance" } } } }
        "404": { description: "604", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /customers/{id}/payments:
    post:
      tags: [Clientes y cartera]
      summary: Registrar abono a cartera (CU-12) — ADMIN, SALES
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [amount], properties: { amount: { type: number, exclusiveMinimum: 0 } } } } } }
      responses:
        "201": { description: Abono registrado, content: { application/json: { schema: { $ref: "#/components/schemas/CustomerPayment" } } } }
        "409": { description: "623 abono mayor al saldo", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }

  # ------------------------------------------------------------ Proveedores
  /suppliers:
    post:
      tags: [Proveedores]
      summary: Crear proveedor — ADMIN, WAREHOUSE
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateSupplier" } } } }
      responses:
        "201": { description: Creado, content: { application/json: { schema: { $ref: "#/components/schemas/Supplier" } } } }
    get:
      tags: [Proveedores]
      summary: Listar proveedores — autenticado
      parameters: [{ $ref: "#/components/parameters/page" }, { $ref: "#/components/parameters/limit" }, { $ref: "#/components/parameters/active" }]
      responses:
        "200": { description: Listado paginado, content: { application/json: { schema: { $ref: "#/components/schemas/SupplierPage" } } } }
  /suppliers/{id}:
    put:
      tags: [Proveedores]
      summary: Editar proveedor — ADMIN, WAREHOUSE
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateSupplier" } } } }
      responses:
        "200": { description: Actualizado, content: { application/json: { schema: { $ref: "#/components/schemas/Supplier" } } } }
        "404": { description: "605", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /suppliers/{id}/purchases:
    post:
      tags: [Proveedores]
      summary: Registrar compra (CU-13) = lote asociado al proveedor — ADMIN, WAREHOUSE
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity, unitCost, expiresAt]
              properties:
                productId: { type: integer }
                quantity: { type: integer, minimum: 1 }
                unitCost: { type: number, minimum: 0 }
                expiresAt: { type: string, format: date, description: "Hoy o posterior (hora de Colombia); un lote vencido responde 400" }
      responses:
        "201": { description: Lote creado, content: { application/json: { schema: { $ref: "#/components/schemas/ProductBatch" } } } }
        "404": { description: "605 proveedor · 601 producto", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }

  # ------------------------------------------------------------ Finanzas
  /financial/scenarios:
    post:
      tags: [Finanzas]
      summary: Registrar y calcular escenario de inversión (CU-14) — ADMIN
      description: |
        Calcula con el mismo modelo del motor de cálculo en Python (capital de trabajo, flujos del proyecto y del
        inversionista, VPN, TIR, payback simple y descontado, índice de rentabilidad, B/C) y guarda el resultado.
        `assumptions` es opcional: cada campo ausente toma el valor del caso base del capítulo 5.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateScenario" } } } }
      responses:
        "201": { description: Escenario calculado, content: { application/json: { schema: { $ref: "#/components/schemas/ScenarioDetail" } } } }
        "400": { $ref: "#/components/responses/Validation" }
        "422": { description: "650 escenario inválido", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    get:
      tags: [Finanzas]
      summary: Listar escenarios con sus indicadores — ADMIN
      parameters: [{ $ref: "#/components/parameters/page" }, { $ref: "#/components/parameters/limit" }]
      responses:
        "200": { description: Listado paginado, content: { application/json: { schema: { $ref: "#/components/schemas/ScenarioPage" } } } }
  /financial/scenarios/compare:
    get:
      tags: [Finanzas]
      summary: Comparar escenarios lado a lado (CU-15, Tabla 7) — ADMIN
      parameters:
        - { name: ids, in: query, required: true, schema: { type: string, example: "1,2,3" }, description: Al menos dos ids separados por coma }
      responses:
        "200": { description: Indicadores de cada escenario en el orden pedido, content: { application/json: { schema: { type: object, properties: { scenarios: { type: array, items: { $ref: "#/components/schemas/ScenarioSummary" } } } } } } }
        "404": { description: "607 (details.missing)", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /financial/scenarios/{id}:
    get:
      tags: [Finanzas]
      summary: Detalle de un escenario (supuestos, flujos, indicadores) — ADMIN
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: Escenario, content: { application/json: { schema: { $ref: "#/components/schemas/ScenarioDetail" } } } }
        "404": { description: "607", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /financial/scenarios/{id}/amortization:
    get:
      tags: [Finanzas]
      summary: Tabla de amortización mes a mes (CU-16) — ADMIN
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: Cuota, interés, abono y saldo por mes
          content:
            application/json:
              schema:
                type: object
                properties:
                  scenarioId: { type: integer }
                  credit: { type: number }
                  termMonths: { type: integer }
                  installment: { type: number }
                  totalInterest: { type: number }
                  rows: { type: array, items: { $ref: "#/components/schemas/AmortizationRow" } }
  /financial/scenarios/{id}/sensitivity:
    get:
      tags: [Finanzas]
      summary: Sensibilidad univariante VPN/TIR (CU-17, RF-06.5) — ADMIN
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { name: variable, in: query, required: true, schema: { $ref: "#/components/schemas/SensitivityVariable" } }
        - { name: from, in: query, schema: { type: number }, description: Inicio del rango (los tres juntos o ninguno; por defecto el rango del capítulo 5) }
        - { name: to, in: query, schema: { type: number } }
        - { name: step, in: query, schema: { type: number } }
      responses:
        "200":
          description: VPN y TIR por cada valor de la variable
          content:
            application/json:
              schema:
                type: object
                properties:
                  scenarioId: { type: integer }
                  variable: { $ref: "#/components/schemas/SensitivityVariable" }
                  range: { $ref: "#/components/schemas/Range" }
                  points: { type: array, items: { type: object, properties: { value: { type: number }, npv: { type: number }, irr: { type: [number, "null"] } } } }
        "422": { description: "650 rango inválido", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /financial/scenarios/{id}/sensitivity/bivariate:
    get:
      tags: [Finanzas]
      summary: Sensibilidad bivariante, grilla de VPN (RF-06.6) — ADMIN
      parameters:
        - { $ref: "#/components/parameters/id" }
        - { name: varX, in: query, required: true, schema: { $ref: "#/components/schemas/SensitivityVariable" } }
        - { name: varY, in: query, required: true, schema: { $ref: "#/components/schemas/SensitivityVariable" } }
        - { name: fromX, in: query, schema: { type: number } }
        - { name: toX, in: query, schema: { type: number } }
        - { name: stepX, in: query, schema: { type: number } }
        - { name: fromY, in: query, schema: { type: number } }
        - { name: toY, in: query, schema: { type: number } }
        - { name: stepY, in: query, schema: { type: number } }
      responses:
        "200":
          description: "npv[y][x] para cada combinación"
          content:
            application/json:
              schema:
                type: object
                properties:
                  scenarioId: { type: integer }
                  varX: { $ref: "#/components/schemas/SensitivityVariable" }
                  varY: { $ref: "#/components/schemas/SensitivityVariable" }
                  xValues: { type: array, items: { type: number } }
                  yValues: { type: array, items: { type: number } }
                  npv: { type: array, items: { type: array, items: { type: number } } }
  /financial/scenarios/{id}/tornado:
    get:
      tags: [Finanzas]
      summary: Diagrama de tornado, VPN a −20 %/+20 % por variable (RF-06.7) — ADMIN
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: Barras ordenadas por amplitud de impacto descendente
          content:
            application/json:
              schema:
                type: object
                properties:
                  scenarioId: { type: integer }
                  delta: { type: number }
                  baseNpv: { type: number }
                  bars:
                    type: array
                    items:
                      type: object
                      properties:
                        variable: { type: string, enum: [grossMargin, salesIncrease, fixedInvestment, tmar, additionalExpensesMonth, inventoryTurnover, salvageValuePct, creditRateEA] }
                        low: { type: number }
                        high: { type: number }
                        npvLow: { type: number }
                        npvHigh: { type: number }
                        amplitude: { type: number }

  # ------------------------------------------------------------ Auditoría
  /audits:
    get:
      tags: [Auditoría]
      summary: Historial de escrituras (CU-18) — ADMIN
      parameters:
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/limit" }
        - { name: userId, in: query, schema: { type: integer } }
        - { name: resource, in: query, schema: { type: string }, description: Coincidencia parcial en la ruta }
        - { $ref: "#/components/parameters/from" }
        - { $ref: "#/components/parameters/to" }
      responses:
        "200": { description: Listado paginado (más recientes primero), content: { application/json: { schema: { $ref: "#/components/schemas/AuditPage" } } } }

  /audits/entity/{entity}/{id}:
    get:
      tags: [Auditoría]
      summary: Línea de tiempo de un registro (brief 2.5, punto 33) — ADMIN
      description: Escrituras que tocaron un registro (quién, cuándo, método y `changes`), de la más reciente a la más antigua.
      parameters:
        - { name: entity, in: path, required: true, schema: { type: string, example: customers }, description: "Recurso raíz de la ruta: products, customers, sales, suppliers…" }
        - { $ref: "#/components/parameters/id" }
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200": { description: Listado paginado, content: { application/json: { schema: { $ref: "#/components/schemas/AuditPage" } } } }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ------------------------------------------------------------ Búsqueda
  /search:
    get:
      tags: [Búsqueda]
      summary: Búsqueda global para Ctrl+K (brief 2.5, punto 29) — todos los roles
      description: |
        Hasta 6 resultados por grupo, sin tildes ni mayúsculas, solo registros activos. Solo vienen los grupos que el
        rol puede ver: `products` y `people` todos; `customers` ADMIN y SALES; `suppliers` ADMIN y WAREHOUSE.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 }, description: Texto a buscar (mínimo 2 caracteres) }
      responses:
        "200":
          description: Resultados por grupo
          content:
            application/json:
              schema:
                type: object
                properties:
                  products: { type: array, items: { type: object, properties: { id: { type: integer }, name: { type: string }, sku: { type: string }, availableStock: { type: integer }, salePrice: { type: number } } } }
                  customers: { type: array, items: { type: object, properties: { id: { type: integer }, name: { type: string }, documentId: { type: string }, balance: { type: number } } } }
                  people: { type: array, items: { type: object, properties: { id: { type: integer }, firstName: { type: string }, lastName: { type: string }, username: { type: string }, role: { type: string } } }, description: Sin correo ni teléfono }
                  suppliers: { type: array, items: { type: object, properties: { id: { type: integer }, name: { type: string } } } }
        "400": { $ref: "#/components/responses/Validation" }

  # ------------------------------------------------------------ Comentarios
  /comments:
    get:
      tags: [Comentarios]
      summary: Comentarios de un registro (brief 2.5, punto 33) — todos los roles
      description: Cada rol solo lee los registros que puede ver (products y batches todos; customers y sales ADMIN y SALES; suppliers ADMIN y WAREHOUSE); si no, 613.
      parameters:
        - { name: entity, in: query, required: true, schema: { $ref: "#/components/schemas/CommentEntity" } }
        - { name: entityId, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Comentarios vivos en orden cronológico, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Comment" } } } } } } }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Comentarios]
      summary: Comentar un registro, opcionalmente respondiendo a otro comentario — todos los roles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entity, entityId, body]
              properties:
                entity: { $ref: "#/components/schemas/CommentEntity" }
                entityId: { type: integer, minimum: 1 }
                body: { type: string, minLength: 1, maxLength: 1000 }
                replyToId: { type: integer, minimum: 1, description: Comentario del mismo registro al que responde }
      responses:
        "201": { description: Comentario creado, content: { application/json: { schema: { $ref: "#/components/schemas/Comment" } } } }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "688 el registro no existe · 685 el comentario al que responde no existe", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "409": { description: "686 el comentario al que responde es de otro registro o se eliminó", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /comments/{id}:
    delete:
      tags: [Comentarios]
      summary: Eliminar un comentario (borrado lógico) — el autor o ADMIN
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "204": { description: Eliminado }
        "403": { description: "687 solo el autor o la administración", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "404": { description: "685 el comentario no existe", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }

  # ------------------------------------------------------------ Reportes
  /reports/sales:
    get:
      tags: [Reportes]
      summary: Ventas por día o por producto (CU-19) — ADMIN, SALES
      parameters:
        - { $ref: "#/components/parameters/from" }
        - { $ref: "#/components/parameters/to" }
        - { name: groupBy, in: query, schema: { type: string, enum: [day, product], default: day } }
      responses:
        "200":
          description: Por defecto los últimos 30 días. Solo ventas no anuladas, agregadas en la base.
          content:
            application/json:
              schema:
                type: object
                properties:
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  groupBy: { type: string }
                  salesCount: { type: integer }
                  units: { type: integer }
                  total: { type: number }
                  cashTotal: { type: number }
                  creditTotal: { type: number }
                  averageTicket: { type: [number, "null"], description: "Total vendido / número de ventas; null si no hubo ventas" }
                  rows:
                    type: array
                    items:
                      oneOf:
                        - { type: object, properties: { date: { type: string }, salesCount: { type: integer }, units: { type: integer }, total: { type: number }, cashTotal: { type: number }, creditTotal: { type: number }, sourceIds: { type: array, items: { type: integer }, description: "Hasta 20 ids de las ventas que componen la fila (trazabilidad)" }, sourceCount: { type: integer } } }
                        - { type: object, properties: { productId: { type: integer }, productName: { type: string }, sku: { type: string }, salesCount: { type: integer }, units: { type: integer }, total: { type: number }, sourceIds: { type: array, items: { type: integer } }, sourceCount: { type: integer } } }
  /reports/inventory:
    get:
      tags: [Reportes]
      summary: Inventario valorizado y lotes por vencer (CU-20) — ADMIN
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 30 }, description: Ventana de "por vencer" }
      responses:
        "200":
          description: Totales y desglose por categoría
          content:
            application/json:
              schema:
                type: object
                properties:
                  asOf: { type: string, format: date }
                  expiringDays: { type: integer }
                  products: { type: integer }
                  activeProducts: { type: integer }
                  units: { type: integer }
                  costValue: { type: number, description: Unidades restantes por lote × costo unitario }
                  saleValue: { type: number, description: Stock × precio de venta vigente }
                  outOfStock: { type: integer }
                  expiringSoon: { $ref: "#/components/schemas/BatchAggregate" }
                  expired: { $ref: "#/components/schemas/BatchAggregate" }
                  byCategory:
                    type: array
                    items: { type: object, properties: { categoryId: { type: integer }, categoryName: { type: string }, products: { type: integer }, units: { type: integer }, costValue: { type: number }, saleValue: { type: number }, productIds: { type: array, items: { type: integer }, description: "Hasta 20 ids de productos de la categoría (trazabilidad)" } } }
  /reports/receivables:
    get:
      tags: [Reportes]
      summary: Cartera por cliente y cartera vencida (CU-20) — ADMIN
      parameters: [{ $ref: "#/components/parameters/overdueDays" }]
      responses:
        "200":
          description: Clientes con saldo, ordenados por saldo descendente
          content:
            application/json:
              schema:
                type: object
                properties:
                  overdueDays: { type: integer }
                  customersWithBalance: { type: integer }
                  totalBalance: { type: number }
                  overdueCustomers: { type: integer }
                  overdueBalance: { type: number }
                  items:
                    type: array
                    items: { type: object, properties: { customerId: { type: integer }, name: { type: string }, creditLimit: { type: number }, balance: { type: number }, lastCreditSaleAt: { type: [string, "null"] }, lastPaymentAt: { type: [string, "null"] }, overdue: { type: boolean } } }

  /reports/exports:
    get:
      tags: [Reportes]
      summary: Historial de reportes descargados — ADMIN (todo el equipo), SALES (los suyos)
      parameters: [{ $ref: "#/components/parameters/page" }, { $ref: "#/components/parameters/limit" }]
      responses:
        "200": { description: Más recientes primero, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/Page" }, { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/ReportExport" } } } }] } } } }
    post:
      tags: [Reportes]
      summary: Registrar un reporte generado en PDF o Excel — ADMIN, SALES (SALES solo `sales`)
      description: >-
        Asigna el folio `R-AAAA-NNNNNN` (año en hora de Colombia + consecutivo) y el hash sha256 de
        `report|format|filters|summary|createdAt|userId`. La app registra ANTES de imprimir el PDF para poner el folio y
        el QR en la portada; `verifyUrl` es la ruta pública de verificación.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [report, format, description]
              properties:
                report: { type: string, enum: [sales, inventory, receivables, scenario] }
                format: { type: string, enum: [pdf, xlsx] }
                description: { type: string, maxLength: 200 }
                filters: { $ref: "#/components/schemas/ExportData", description: "Filtros con los que se generó (from, to, groupBy, days, overdueDays…)" }
                summary: { $ref: "#/components/schemas/ExportData", description: "Indicadores principales del documento" }
      responses:
        "201": { description: Registrada, content: { application/json: { schema: { $ref: "#/components/schemas/ReportExport" } } } }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /reports/verify/{folio}:
    get:
      tags: [Reportes]
      summary: Verificar la autenticidad de un documento por su folio (QR de la portada) — público
      description: Sin token; 30 consultas por minuto por IP (429 con código 640). Solo devuelve los datos de emisión.
      security: []
      parameters:
        - { name: folio, in: path, required: true, schema: { type: string, pattern: "^R-\\d{4}-\\d{6}$" } }
      responses:
        "200":
          description: Documento auténtico
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean, enum: [true] }
                  folio: { type: string }
                  report: { type: string, enum: [sales, inventory, receivables, scenario] }
                  format: { type: string, enum: [pdf, xlsx] }
                  description: { type: string }
                  createdAt: { type: string, format: date-time }
                  generatedBy: { type: string, description: Usuario que lo generó }
                  filters: { $ref: "#/components/schemas/ExportData" }
                  summary: { $ref: "#/components/schemas/ExportData" }
                  hash: { type: [string, "null"], description: sha256 en hexadecimal; null en registros anteriores a la migración 0010 }
        "400": { $ref: "#/components/responses/Validation" }
        "404": { description: "680 el folio no existe", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }

  # ------------------------------------------------------------ Chat del equipo
  /chat/messages:
    get:
      tags: [Chat del equipo]
      summary: Mensajes de una conversación o de un hilo en orden cronológico — cualquier rol
      description: >-
        Sin `with`, el canal general; con `with`, el privado con esa persona (603 si no existe); con `thread`, las
        respuestas de ese hilo (trae además `root`). La conversación principal no incluye respuestas de hilos.
        Sin cursor, los últimos `limit`; `after` = lo posterior, `before` = lo anterior (historial), `around` = una
        ventana alrededor de ese mensaje (609 si no es de la conversación). Consultar cuenta como "entregado", no como
        "visto".
      parameters:
        - { name: with, in: query, schema: { type: integer, minimum: 1 }, description: Id de la otra persona (mensajes privados) }
        - { name: thread, in: query, schema: { type: integer, minimum: 1 }, description: Id del mensaje que abre el hilo }
        - { name: after, in: query, schema: { type: integer, minimum: 1 } }
        - { name: before, in: query, schema: { type: integer, minimum: 1 } }
        - { name: around, in: query, schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200": { description: Mensajes, content: { application/json: { schema: { $ref: "#/components/schemas/ChatPage" } } } }
        "404": { description: "603 persona inexistente · 609 mensaje inexistente o de un privado ajeno", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    post:
      tags: [Chat del equipo]
      summary: Publicar un mensaje (canal general, privado, hilo, cita, adjuntos) — cualquier rol
      description: >-
        La cita (`replyToId`) y el hilo (`threadRootId`) deben ser de la misma conversación; la excepción es la
        respuesta por privado: un privado al autor de un mensaje de #general puede citarlo y no se publica en el canal.
        Sin hilos dentro de hilos. Cuerpo vacío solo con adjuntos (ya subidos, propios y sin usar). Con el mismo
        `clientId` (UUID) se devuelve el mensaje ya guardado: un reintento no duplica. Reconoce `@usuario` y, en
        #general, `@todos` / `@equipo`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string, maxLength: 1000 }
                recipientId: { type: integer, minimum: 1, description: "Destinatario de un mensaje privado; sin él, canal general" }
                replyToId: { type: integer, minimum: 1 }
                threadRootId: { type: integer, minimum: 1 }
                attachmentIds: { type: array, maxItems: 5, items: { type: integer, minimum: 1 } }
                clientId: { type: string, format: uuid }
      responses:
        "201": { description: Publicado (o el ya publicado con ese clientId), content: { application/json: { schema: { $ref: "#/components/schemas/ChatMessage" } } } }
        "400": { $ref: "#/components/responses/Validation" }
        "404": { description: "603 destinatario inexistente o inactivo · 609 cita u hilo inexistente o ajeno", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /chat/messages/{id}:
    patch:
      tags: [Chat del equipo]
      summary: Editar el texto de un mensaje propio — solo el autor
      description: Queda `editedAt`; las menciones se recalculan. Vacío solo si el mensaje lleva adjuntos; un eliminado no se edita.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [body], properties: { body: { type: string, maxLength: 1000 } } } } } }
      responses:
        "200": { description: Mensaje editado, content: { application/json: { schema: { $ref: "#/components/schemas/ChatMessage" } } } }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "609", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    delete:
      tags: [Chat del equipo]
      summary: "Eliminar para todos — el autor; en #general también ADMIN"
      description: Conserva el lugar, los acuses y el hilo; borra texto, menciones, adjuntos y fijado (`deleted` = true).
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Mensaje eliminado, content: { application/json: { schema: { $ref: "#/components/schemas/ChatMessage" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "609", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /chat/messages/state:
    get:
      tags: [Chat del equipo]
      summary: Estado actual de mensajes ya cargados (acuses, fijado, hilo) — cualquier rol
      parameters:
        - { name: ids, in: query, required: true, schema: { type: string }, description: "Hasta 100 ids separados por coma; los no visibles se omiten" }
      responses:
        "200": { description: Mensajes visibles, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/ChatMessage" } } } } } } }
  /chat/messages/{id}/receipts:
    get:
      tags: [Chat del equipo]
      summary: Quién leyó, a quién le llegó y quién falta — solo el autor del mensaje
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Detalle, content: { application/json: { schema: { $ref: "#/components/schemas/ChatReceipts" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "609", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /chat/messages/{id}/played:
    post:
      tags: [Chat del equipo]
      summary: Marcar que quien llama reprodujo la nota de voz del mensaje — cualquier rol; no se audita
      description: >-
        Solo en un mensaje ajeno, vigente y con adjunto de audio (400 si no). Deja el acuse propio con `playedAt` (y
        entregado y leído si aún no lo estaba) y avisa al autor con un evento `update` para que el micrófono de sus
        chulitos cambie en vivo. Repetirlo no cambia nada.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Acuse actualizado (0 si ya estaba), content: { application/json: { schema: { type: object, properties: { updated: { type: integer } } } } } }
        "400": { $ref: "#/components/responses/Validation" }
        "404": { description: "609", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /chat/messages/{id}/pin:
    put:
      tags: [Chat del equipo]
      summary: "Fijar — en #general solo ADMIN; en un privado, sus participantes (máx. 10 por conversación)"
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Mensaje fijado, content: { application/json: { schema: { $ref: "#/components/schemas/ChatMessage" } } } }
        "400": { $ref: "#/components/responses/Validation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "609", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    delete:
      tags: [Chat del equipo]
      summary: Desfijar — mismas reglas que fijar
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Mensaje sin fijar, content: { application/json: { schema: { $ref: "#/components/schemas/ChatMessage" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "609", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /chat/pins:
    get:
      tags: [Chat del equipo]
      summary: Mensajes fijados del canal general o del privado (`with`) — cualquier rol
      parameters: [{ name: with, in: query, schema: { type: integer, minimum: 1 } }]
      responses:
        "200": { description: Fijados, el más reciente primero, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/ChatMessage" } } } } } } }
  /chat/media:
    get:
      tags: [Chat del equipo]
      summary: Contenido de una conversación (fotos, archivos, notas de voz o enlaces) — cualquier rol
      description: >-
        Lo más reciente primero, con hilos incluidos y sin mensajes eliminados. Sin `with`, el canal general; con
        `with`, el privado con esa persona (603 si no existe). `link` saca las direcciones http(s) del texto de los
        mensajes (hasta 20 por mensaje, de los 500 mensajes con enlaces más recientes).
      parameters:
        - { name: with, in: query, schema: { type: integer, minimum: 1 } }
        - { name: kind, in: query, required: true, schema: { type: string, enum: [image, file, audio, link] } }
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200": { description: Página, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/Page" }, { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/ChatMediaItem" } } } }] } } } }
        "400": { $ref: "#/components/responses/Validation" }
        "404": { description: "603", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /chat/read:
    post:
      tags: [Chat del equipo]
      summary: Marcar como visto (conversación o hilo, hasta un mensaje) — cualquier rol; no se audita
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                with: { type: integer, minimum: 1, description: "Privado con esa persona; sin él, #general" }
                threadRootId: { type: integer, minimum: 1, description: Solo las respuestas de ese hilo }
                upTo: { type: integer, minimum: 1, description: "Hasta este mensaje (incluido); sin él, todo" }
                includeThreads: { type: boolean, description: "También las respuestas de todos los hilos de la conversación" }
      responses:
        "200": { description: Acuses actualizados, content: { application/json: { schema: { type: object, properties: { updated: { type: integer } } } } } }
  /chat/search:
    get:
      tags: [Chat del equipo]
      summary: Buscar en el chat (texto, autor o nombre de adjunto, sin tildes; y/o por día) — solo lo que la persona puede ver
      description: Hace falta `q` (2 caracteres o más) o `day`; con `day` el texto es opcional. El día se cuenta en la hora del negocio (America/Bogota).
      parameters:
        - { name: q, in: query, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: day, in: query, schema: { type: string, format: date }, description: "Solo mensajes de ese día (YYYY-MM-DD)" }
        - { name: with, in: query, schema: { type: integer, minimum: 1 }, description: Solo ese privado }
        - { name: general, in: query, schema: { type: boolean }, description: "Solo #general" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 60, default: 30 } }
      responses:
        "200": { description: Coincidencias (incluye respuestas de hilos), content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/ChatMessage" } } } } } } }
        "400": { $ref: "#/components/responses/Validation" }
  /chat/attachments:
    post:
      tags: [Chat del equipo]
      summary: Subir un adjunto para el próximo mensaje — cualquier rol
      description: >-
        Cuerpo binario de hasta 10 MB; tipo en `Content-Type` (fotos JPEG/PNG/WebP/GIF, notas de voz WebM/Ogg/MP4/MPEG,
        PDF, Excel, Word, CSV o texto) y nombre en `X-File-Name` (codificado con encodeURIComponent). En notas de voz,
        `X-Duration-Ms` lleva la duración en milisegundos (opcional; máximo una hora). Queda a nombre de quien lo sube
        hasta que lo envíe; si no lo envía en 24 h se borra.
      parameters:
        - { name: X-File-Name, in: header, required: true, schema: { type: string } }
        - { name: X-Duration-Ms, in: header, schema: { type: integer, minimum: 1 }, description: Solo en audio }
      requestBody: { required: true, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
      responses:
        "201": { description: Subido, content: { application/json: { schema: { $ref: "#/components/schemas/ChatAttachment" } } } }
        "400": { $ref: "#/components/responses/Validation" }
  /chat/attachments/{id}:
    get:
      tags: [Chat del equipo]
      summary: Descargar un adjunto — quien puede ver el mensaje que lo lleva
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: El archivo (fotos y notas de voz en línea; el resto como descarga), content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "404": { description: "609", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /chat/stream:
    get:
      tags: [Chat del equipo]
      summary: Avisos en vivo del chat (Server-Sent Events) — cualquier rol
      description: >-
        `text/event-stream` con eventos `data: <json>`: `ready` al abrir; `message` (id, peerId, threadRootId, autor,
        vista previa, mentionsMe); `update` (ids cuyo estado cambió: acuses, fijado, hilo); `team` (contadores propios);
        `alarm` (alarma personalizada que acaba de sonar: alarmId, title, description, area, firedAt); `due` (resumen diario
        de vencimientos del rol: count, summary);
        `bye` cuando la sesión deja de ser válida. Solo llegan los de conversaciones que la persona puede ver. Un
        comentario `: ping` cada 25 s mantiene viva la conexión. Recibir un mensaje por aquí cuenta como entregado.
      responses:
        "200": { description: Flujo de eventos, content: { text/event-stream: { schema: { type: string } } } }
  /chat/team:
    get:
      tags: [Chat del equipo]
      summary: Equipo del chat — presencia, no leídos, menciones y último mensaje por conversación — cualquier rol
      description: >-
        En línea = petición autenticada en los últimos 90 segundos sin cierre de sesión posterior. Los no leídos
        incluyen respuestas de hilos. Consultarlo cuenta como "entregado".
      responses:
        "200":
          description: Canal general y personas activas (sin incluir a quien consulta)
          content:
            application/json:
              schema:
                type: object
                properties:
                  onlineCount: { type: integer }
                  unreadTotal: { type: integer }
                  general: { type: object, properties: { unread: { type: integer }, mentions: { type: integer }, lastMessage: { $ref: "#/components/schemas/ChatPreview" } } }
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        firstName: { type: string }
                        lastName: { type: string }
                        username: { type: string }
                        role: { $ref: "#/components/schemas/Role" }
                        online: { type: boolean }
                        lastSeenAt: { type: [string, "null"], format: date-time }
                        unread: { type: integer }
                        mentions: { type: integer }
                        lastMessage: { $ref: "#/components/schemas/ChatPreview" }

  # ------------------------------------------------------------ Contactos del sitio
  /contact:
    post:
      tags: [Contactos del sitio]
      summary: Dejar un mensaje desde la página pública — público, máximo 5 por hora por IP (640)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, body]
              description: Teléfono o correo (al menos uno). `website` es un campo trampa oculto; si llega lleno el mensaje se descarta.
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                phone: { type: string, maxLength: 30 }
                email: { type: string, format: email, maxLength: 120 }
                topic: { type: string, maxLength: 80 }
                body: { type: string, minLength: 5, maxLength: 2000 }
                website: { type: string }
      responses:
        "202": { description: Recibido }
        "400": { $ref: "#/components/responses/Validation" }
        "429": { description: "640 demasiados envíos", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /contact-messages:
    get:
      tags: [Contactos del sitio]
      summary: Bandeja de contactos — ADMIN (sin filtro, los no archivados)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [NEW, READ, ARCHIVED] } }
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200": { description: Más recientes primero, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/Page" }, { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/ContactMessage" } } } }] } } } }
  /contact-messages/{id}:
    patch:
      tags: [Contactos del sitio]
      summary: Cambiar el estado de un contacto — ADMIN
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [NEW, READ, ARCHIVED] } } } } } }
      responses:
        "200": { description: Actualizado, content: { application/json: { schema: { $ref: "#/components/schemas/ContactMessage" } } } }
        "404": { description: "608 contacto no encontrado", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }

  # ------------------------------------------------------------ Asistente de IA
  /ai/status:
    get:
      tags: [Asistente de IA]
      summary: ¿Hay IA configurada? — cualquier rol
      responses:
        "200": { description: Estado, content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean }, model: { type: [string, "null"] } } } } } }
  /ai/briefing:
    get:
      tags: [Asistente de IA]
      summary: Recomendaciones del día del rol (calculadas sin IA) y párrafo que las prioriza (con IA) — cualquier rol
      description: >-
        restock (cobertura < 10 días al ritmo de 30 días), rotate (lote que vence en 45 días con sobrante proyectado),
        collect (clientes con saldo), idle (sin ventas en 60 días). ADMIN ve todas; SALES solo collect; WAREHOUSE todas
        menos collect. `text` es null sin IA o si falla.
      responses:
        "200": { description: Resumen, content: { application/json: { schema: { type: object, properties: { text: { type: [string, "null"] }, generatedAt: { type: string, format: date-time }, insights: { type: array, items: { type: object } } } } } } }
  /ai/chat:
    post:
      tags: [Asistente de IA]
      summary: Pregunta al asistente con herramientas del rol — cualquier rol
      description: >-
        La conversación viaja completa (máx. 20 turnos; el último es de la persona); el servidor guarda la última pregunta y
        la respuesta en la conversación (`conversationId`; sin él crea una nueva). Con `asincrono: true` responde 202
        `{ tareaId, conversationId, userMessageId }` y la respuesta se recoge en `GET /ai/mensajes/{tareaId}`. `screen` es la
        pantalla desde la que se pregunta (contexto del prompt). Las herramientas de consulta llaman a la misma lógica que
        los endpoints, con sus roles. `proposals` son tarjetas: `action` (la petición exacta a un endpoint de escritura, que
        la app ejecuta solo si la persona confirma) o `report` (abre un reporte).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                asincrono: { type: boolean, default: false, description: Respuesta en dos pasos (202 + consulta de la tarea). }
                conversationId: { type: integer, description: Conversación guardada a la que pertenece la pregunta. }
                screen: { type: string, enum: [inicio, inventario, lotes, ventas, clientes, proveedores, finanzas, reportes, tita, chat, contactos, usuarios, auditoria, alarmas, perfil] }
                messages:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      content: { type: string, maxLength: 4000 }
                      attachments:
                        type: array
                        maxItems: 4
                        description: Solo se envían completos en la última pregunta. Imagen o PDF en base64 (sin data:), o texto ya extraído (CSV, Excel, .txt).
                        items:
                          type: object
                          required: [kind, name]
                          properties:
                            kind: { type: string, enum: [image, pdf, text] }
                            name: { type: string }
                            mediaType: { type: string, enum: [image/jpeg, image/png, image/webp] }
                            data: { type: string }
                            text: { type: string, maxLength: 200000 }
      responses:
        "200": { description: Respuesta, content: { application/json: { schema: { type: object, properties: { reply: { type: string }, sources: { type: array, items: { type: object } }, proposals: { type: array, items: { type: object } }, conversationId: { type: integer }, messageId: { type: integer }, userMessageId: { type: integer } } } } } }
        "202": { description: Pregunta aceptada (asincrono), content: { application/json: { schema: { type: object, properties: { tareaId: { type: string }, conversationId: { type: integer }, userMessageId: { type: integer } } } } } }
        "429": { description: Tope de consultas (640) }
  /chat/messages/{id}/tita-actions:
    patch:
      tags: [Asistente de IA]
      summary: Cómo quedó una tarjeta de Tita en un mensaje del chat (@Tita) — solo quien la invocó
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [index, status], properties: { index: { type: integer }, status: { type: string, enum: [done, failed, dismissed] }, note: { type: string, maxLength: 300 } } } } } }
      responses:
        "204": { description: Guardado }
        "403": { description: No es quien invocó a Tita (613) }
        "404": { description: El mensaje no existe o no es de Tita (609) }
  /comments/{id}/tita-actions:
    patch:
      tags: [Asistente de IA]
      summary: Cómo quedó una tarjeta de Tita en un comentario (@Tita) — solo quien la invocó
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [index, status], properties: { index: { type: integer }, status: { type: string, enum: [done, failed, dismissed] }, note: { type: string, maxLength: 300 } } } } } }
      responses:
        "204": { description: Guardado }
        "403": { description: No es quien invocó a Tita (613) }
        "404": { description: El comentario no existe o no es de Tita (685) }
  /ai/complete:
    post:
      tags: [Asistente de IA]
      summary: Autocompletado de la pregunta que se está escribiendo (modelo rápido) — cualquier rol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 600 }
                screen: { type: string }
      responses:
        "200": { description: "{ completion } (cadena vacía si no hay sugerencia)" }
        "429": { description: Tope de consultas (640) }
  /ai/mensajes/{tareaId}:
    get:
      tags: [Asistente de IA]
      summary: Segundo paso de la respuesta en dos pasos — cualquier rol (solo la propia)
      parameters:
        - { name: tareaId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Respuesta lista (misma forma que el 200 de /ai/chat) }
        "202": { description: Tita sigue trabajando, content: { application/json: { schema: { type: object, properties: { tareaId: { type: string }, status: { type: string, enum: [pending] } } } } } }
        "404": { description: La tarea no existe, venció o es de otra persona (662) }
        "502": { description: El proveedor de IA falló (661) }
  /ai/conversations:
    get:
      tags: [Asistente de IA]
      summary: Historial de conversaciones propias con Tita — cualquier rol
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200": { description: "{ count, page, pages, items: [{ id, title, screen, messages, createdAt, updatedAt }] }" }
  /ai/conversations/{id}:
    get:
      tags: [Asistente de IA]
      summary: Una conversación propia con sus mensajes — cualquier rol
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "Conversación con `items`: [{ id, role (user|assistant|event), content, attachments (solo nombres), sources, proposals, actions, error, createdAt }]" }
        "404": { description: No existe o es de otra persona (663) }
    delete:
      tags: [Asistente de IA]
      summary: Borra una conversación propia — cualquier rol
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Borrada }
        "404": { description: No existe o es de otra persona (663) }
  /ai/conversations/{id}/events:
    post:
      tags: [Asistente de IA]
      summary: Nota de una tarjeta confirmada o descartada — cualquier rol
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, maxLength: 600 }
                messageId: { type: integer, description: Mensaje de Tita con la tarjeta (va con index). }
                index: { type: integer, description: Índice de la tarjeta dentro del mensaje. }
                status: { type: string, enum: [idle, running, done, failed, dismissed] }
                note: { type: string, maxLength: 300 }
      responses:
        "201": { description: "{ id }" }
        "404": { description: No existe o es de otra persona (663) }
        "503": { description: IA no configurada (660) }
        "502": { description: Falla del proveedor de IA (661) }
  /ai/drafts:
    post:
      tags: [Asistente de IA]
      summary: Borrador de texto con datos reales — el rol depende del tipo
      description: "collection_message (ADMIN, SALES), contact_reply (ADMIN), report_summary (ADMIN, SALES), scenario_explain (ADMIN)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [collection_message, contact_reply, report_summary, scenario_explain] }
                customerId: { type: integer }
                contactId: { type: integer }
                scenarioId: { type: integer }
                from: { type: string, format: date }
                to: { type: string, format: date }
      responses:
        "200": { description: Borrador, content: { application/json: { schema: { type: object, properties: { kind: { type: string }, text: { type: string }, phone: { type: [string, "null"] } } } } } }
  /ai/invoice:
    post:
      tags: [Asistente de IA]
      summary: Lee la foto de una factura y la cruza con catálogo y proveedores — ADMIN, WAREHOUSE
      description: Cuerpo hasta 8 MB. No registra nada; la app registra una compra por línea tras la confirmación.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image, mediaType]
              properties:
                image: { type: string, description: "base64 sin encabezado data:" }
                mediaType: { type: string, enum: [image/jpeg, image/png, image/webp] }
      responses:
        "200": { description: Lectura con candidatos por línea y advertencias }

  # ------------------------------------------------------------ Alarmas y avisos (brief 2026, puntos 12 a 14)
  /alarms:
    get:
      tags: [Alarmas y avisos]
      summary: Alarmas propias — cualquier rol
      description: >-
        `?status=upcoming` (por defecto) lista las alarmas de quien consulta (activas primero, por próximo disparo);
        `?status=past` lista los disparos ocurridos (`AlarmFire`). Paginado.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [upcoming, past], default: upcoming } }
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200":
          description: Listado paginado de alarmas (o de disparos con `past`)
          content: { application/json: { schema: { type: object, properties: { count: { type: integer }, page: { type: integer }, pages: { type: integer }, items: { type: array, items: { oneOf: [{ $ref: "#/components/schemas/Alarm" }, { $ref: "#/components/schemas/AlarmFire" }] } } } } } }
    post:
      tags: [Alarmas y avisos]
      summary: Crear una alarma propia — cualquier rol
      description: >-
        Hora local del negocio (`BUSINESS_TZ`). `repeat`: ONCE (exige `date`), DAILY, WEEKDAYS (lunes a viernes) o
        WEEKLY (exige `weekdays`, 0 = domingo … 6 = sábado). El servidor calcula `nextFireAt`; una ONCE ya pasada
        responde 671. Tope de 50 alarmas por persona (672).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AlarmInput" } } }
      responses:
        "201": { description: Alarma creada, content: { application/json: { schema: { $ref: "#/components/schemas/Alarm" } } } }
        "400": { $ref: "#/components/responses/Validation" }
        "422": { description: "671 sin disparo futuro", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /alarms/ics:
    get:
      tags: [Alarmas y avisos]
      summary: Todas las alarmas activas en un archivo .ics — cualquier rol
      description: "`text/calendar` (RFC 5545): un VEVENT por alarma con RRULE según su repetición, `TZID` America/Bogota y un VALARM a la hora exacta. Archivo `alarmas-mi-tierrita.ics`."
      responses:
        "200": { description: Calendario, content: { text/calendar: { schema: { type: string } } } }
  /alarms/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Alarmas y avisos]
      summary: Una alarma propia — cualquier rol
      responses:
        "200": { description: Alarma, content: { application/json: { schema: { $ref: "#/components/schemas/Alarm" } } } }
        "404": { description: "670 no existe o es de otra persona", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    put:
      tags: [Alarmas y avisos]
      summary: Reemplazar la programación de una alarma — cualquier rol
      description: Recibe el formulario completo (`AlarmInput`), recalcula el próximo disparo y la deja activa.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AlarmInput" } } }
      responses:
        "200": { description: Alarma actualizada, content: { application/json: { schema: { $ref: "#/components/schemas/Alarm" } } } }
        "400": { $ref: "#/components/responses/Validation" }
        "404": { description: "670", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    delete:
      tags: [Alarmas y avisos]
      summary: Eliminar una alarma propia (y sus disparos) — cualquier rol
      responses:
        "204": { description: Eliminada }
        "404": { description: "670", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /alarms/{id}/active:
    parameters: [{ $ref: "#/components/parameters/id" }]
    patch:
      tags: [Alarmas y avisos]
      summary: Encender o apagar una alarma — cualquier rol
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [active], properties: { active: { type: boolean } } } } }
      responses:
        "200": { description: Alarma con `active` y `nextFireAt` al día, content: { application/json: { schema: { $ref: "#/components/schemas/Alarm" } } } }
        "422": { description: "671 no se puede encender: ya no tiene disparo futuro", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /alarms/{id}/ics:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [Alarmas y avisos]
      summary: Archivo .ics de una alarma — cualquier rol
      description: "`text/calendar`, archivo `alarma-<id>.ics`, para agregarla al calendario del teléfono."
      responses:
        "200": { description: Calendario, content: { text/calendar: { schema: { type: string } } } }
        "404": { description: "670", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /calendar:
    get:
      tags: [Calendario]
      summary: Calendario reutilizable por rol — cualquier rol
      description: >-
        Brief 2.5, punto 31. Ítems con fecha dentro del rango (por defecto el mes en curso; como mucho 62 días, si no
        400): lotes con existencias que vencen en el rango (ADMIN y WAREHOUSE; alta si vencen en 7 días o ya
        vencieron), cobros de cartera (ADMIN y SALES; fecha en que la última venta a crédito cumple el plazo del
        reporte), alarmas propias (próximos disparos y los ya ocurridos) y cierres de mes. «Pedidos», «nómina» y
        «conteos de inventario» no existen en el sistema.
      parameters:
        - { $ref: "#/components/parameters/from" }
        - { $ref: "#/components/parameters/to" }
      responses:
        "200":
          description: Ítems del rango y resumen
          content:
            application/json:
              schema:
                type: object
                properties:
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  items: { type: array, items: { $ref: "#/components/schemas/CalendarItem" } }
                  summary:
                    type: object
                    properties:
                      pending: { type: integer }
                      overdue: { type: integer }
                      done: { type: integer }
        "400": { $ref: "#/components/responses/Validation" }

  /notifications/due:
    get:
      tags: [Alarmas y avisos]
      summary: Avisos de vencimiento según el rol — cualquier rol
      description: >-
        Calculados en el servidor: ADMIN y WAREHOUSE reciben lotes vencidos y por vencer (7 días); ADMIN y SALES,
        cartera vencida (misma regla del reporte: última venta a crédito con más de 30 días) y cobros a 5 días de
        vencer. El planificador publica el mismo resumen a las 07:00 (evento `due` del stream y Web Push) una vez al
        día. «Pedidos por vencer» no existe: no hay tabla de pedidos.
      responses:
        "200":
          description: Avisos del rol
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  summary: { type: string }
                  items: { type: array, items: { $ref: "#/components/schemas/DueItem" } }

  # ------------------------------------------------------------ Web Push
  /push/public-key:
    get:
      tags: [Web Push]
      summary: Clave pública VAPID — cualquier rol
      responses:
        "200": { description: "`enabled` false si el servidor no tiene par VAPID", content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean }, publicKey: { type: [string, "null"] } } } } } }
  /push/subscriptions:
    post:
      tags: [Web Push]
      summary: Registrar este dispositivo — cualquier rol
      description: Guarda lo que devuelve `PushManager.subscribe`; si el endpoint ya existía, lo reemplaza (también si era de otra cuenta en el mismo navegador).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: { type: string, format: uri }
                keys: { type: object, required: [p256dh, auth], properties: { p256dh: { type: string }, auth: { type: string } } }
                userAgent: { type: string, maxLength: 200 }
      responses:
        "201": { description: Suscripción guardada }
        "400": { $ref: "#/components/responses/Validation" }
        "503": { description: "673 push no configurado", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    delete:
      tags: [Web Push]
      summary: Dar de baja este dispositivo — cualquier rol
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [endpoint], properties: { endpoint: { type: string } } } } }
      responses:
        "204": { description: Baja hecha }
        "404": { description: "674 no existe o es de otra persona", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }

  # ------------------------------------------------------------ Biblioteca
  /library:
    get:
      tags: [Biblioteca]
      summary: Documentos y enlaces del equipo — cualquier rol
      description: Solo los ítems cuyo `roles` esté vacío o incluya el rol de quien consulta. Lo más reciente primero.
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [document, link] } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: "Busca en título, descripción y nombre del archivo (sin tildes ni mayúsculas)" }
        - { $ref: "#/components/parameters/page" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200": { description: Página, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/Page" }, { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/LibraryItem" } } } }] } } } }
  /library/links:
    post:
      tags: [Biblioteca]
      summary: Agregar un enlace — ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, url]
              properties:
                title: { type: string, maxLength: 140 }
                description: { type: string, maxLength: 400 }
                url: { type: string, maxLength: 2000, description: "Solo http:// o https://" }
                roles: { type: array, items: { $ref: "#/components/schemas/Role" }, description: "Quién lo ve; vacío o los tres = todos" }
      responses:
        "201": { description: Creado, content: { application/json: { schema: { $ref: "#/components/schemas/LibraryItem" } } } }
        "400": { $ref: "#/components/responses/Validation" }
  /library/documents:
    post:
      tags: [Biblioteca]
      summary: Subir un documento — ADMIN
      description: >-
        Cuerpo binario de hasta 10 MB; tipo en `Content-Type` (los mismos tipos que los adjuntos del chat, salvo audio:
        fotos JPEG/PNG/WebP/GIF, PDF, Excel, Word, CSV o texto). Cabeceras codificadas con encodeURIComponent:
        `X-File-Name` (obligatoria), `X-Title` (obligatoria), `X-Description` y `X-Roles` (roles separados por coma;
        vacío = todos).
      parameters:
        - { name: X-File-Name, in: header, required: true, schema: { type: string } }
        - { name: X-Title, in: header, required: true, schema: { type: string } }
        - { name: X-Description, in: header, schema: { type: string } }
        - { name: X-Roles, in: header, schema: { type: string }, description: "Ej. ADMIN,SALES" }
      requestBody: { required: true, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
      responses:
        "201": { description: Creado, content: { application/json: { schema: { $ref: "#/components/schemas/LibraryItem" } } } }
        "400": { $ref: "#/components/responses/Validation" }
  /library/{id}:
    put:
      tags: [Biblioteca]
      summary: Editar título, descripción, roles o dirección — ADMIN
      description: El archivo de un documento no se reemplaza (se sube otro ítem); enviar `url` a un documento responde 400.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 140 }
                description: { type: string, maxLength: 400 }
                url: { type: string, maxLength: 2000 }
                roles: { type: array, items: { $ref: "#/components/schemas/Role" } }
      responses:
        "200": { description: Actualizado, content: { application/json: { schema: { $ref: "#/components/schemas/LibraryItem" } } } }
        "400": { $ref: "#/components/responses/Validation" }
        "404": { description: "690", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    delete:
      tags: [Biblioteca]
      summary: Eliminar un ítem — ADMIN
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "204": { description: Eliminado }
        "404": { description: "690", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /library/{id}/file:
    get:
      tags: [Biblioteca]
      summary: Descargar el archivo de un documento — quien pueda verlo
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: El archivo (imágenes, PDF y texto en línea; el resto como descarga), content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "404": { description: "690 (tampoco si el rol no puede verlo)", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    id: { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
    active: { name: active, in: query, schema: { type: boolean } }
    from: { name: from, in: query, schema: { type: string, format: date }, description: Fecha inicial inclusive (YYYY-MM-DD) }
    to: { name: to, in: query, schema: { type: string, format: date }, description: Fecha final inclusive (YYYY-MM-DD) }
    overdueDays: { name: overdueDays, in: query, schema: { type: integer, default: 30 }, description: "Cartera vencida: saldo > 0 y última venta a crédito con más de estos días" }
  responses:
    Validation:
      description: Datos de entrada mal formados (código 400)
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/ErrorBody" }
              - { type: object, properties: { details: { type: array, items: { type: object, properties: { path: { type: string }, message: { type: string } } } } } }
    Unauthorized:
      description: "611 token ausente o inválido · 612 usuario inactivo"
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } }
    Forbidden:
      description: "613 rol insuficiente (details.requiredRoles)"
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } }
  schemas:
    AlarmInput:
      type: object
      required: [title, timeOfDay, repeat]
      properties:
        title: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 400 }
        timeOfDay: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$", description: HH:MM, hora local del negocio }
        repeat: { type: string, enum: [ONCE, DAILY, WEEKDAYS, WEEKLY] }
        weekdays: { type: array, items: { type: integer, minimum: 0, maximum: 6 }, description: Solo WEEKLY (0 = domingo) }
        date: { type: string, format: date, description: Solo ONCE }
        area: { type: string, enum: [inicio, inventario, lotes, ventas, clientes, proveedores, finanzas, reportes, chat, alarmas] }
    Alarm:
      allOf:
        - { $ref: "#/components/schemas/AlarmInput" }
        - type: object
          properties:
            id: { type: integer }
            active: { type: boolean }
            nextFireAt: { type: [string, "null"], format: date-time }
            lastFiredAt: { type: [string, "null"], format: date-time }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    AlarmFire:
      type: object
      properties:
        id: { type: integer }
        alarmId: { type: integer }
        title: { type: string }
        description: { type: [string, "null"] }
        area: { type: [string, "null"] }
        firedAt: { type: string, format: date-time }
        seenAt: { type: [string, "null"], format: date-time }
    DueItem:
      type: object
      properties:
        kind: { type: string, enum: [batch_expiring, batch_expired, receivable_overdue, receivable_due_soon] }
        id: { type: integer, description: Id del lote o del cliente }
        title: { type: string }
        detail: { type: string }
        dueOn: { type: string, format: date }
        href: { type: string, description: Pantalla de la app }
    DirectoryEntry:
      type: object
      properties:
        id: { type: integer }
        firstName: { type: string }
        lastName: { type: string }
        username: { type: string }
        role: { type: string, enum: [ADMIN, SALES, WAREHOUSE] }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        hasAvatar: { type: boolean }
        avatarUpdatedAt: { type: string, format: date-time, nullable: true }
        online: { type: boolean }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        active: { type: boolean, description: Solo ADMIN recibe cuentas inactivas }
    CalendarItem:
      type: object
      properties:
        id: { type: string, description: "Único en la respuesta: <kind>-<id>[-<fecha>]" }
        kind: { type: string, enum: [batch, receivable, alarm, closing] }
        title: { type: string }
        detail: { type: string }
        date: { type: string, format: date }
        priority: { type: string, enum: [alta, media, baja] }
        area: { type: string, description: Lotes, Cartera, Alarmas o Cierres }
        status: { type: string, enum: [pending, overdue, done] }
        href: { type: string, description: Pantalla de la app }
    ErrorBody:
      type: object
      required: [message]
      properties:
        message: { type: string, description: Código de dominio (ver README), example: "610" }
        details: { description: Información adicional según el código }
    Page:
      type: object
      required: [count, page, pages, items]
      properties:
        count: { type: integer }
        page: { type: integer }
        pages: { type: integer }
        items: { type: array, items: {} }
    Role: { type: string, enum: [ADMIN, SALES, WAREHOUSE] }
    User:
      type: object
      properties:
        id: { type: integer }
        firstName: { type: string }
        lastName: { type: string }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        active: { type: boolean }
        email: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        hasAvatar: { type: boolean, description: "Tiene foto (GET /users/{id}/avatar)" }
        avatarUpdatedAt: { type: [string, "null"], format: date-time, description: "Clave de caché de la foto" }
    LibraryItem:
      type: object
      properties:
        id: { type: integer }
        kind: { type: string, enum: [document, link] }
        title: { type: string }
        description: { type: string }
        url: { type: [string, "null"], description: "Solo en enlaces" }
        name: { type: [string, "null"], description: "Nombre del archivo (documentos)" }
        mime: { type: [string, "null"] }
        size: { type: [integer, "null"] }
        roles: { type: array, items: { $ref: "#/components/schemas/Role" }, description: "Vacío = todos" }
        createdBy: { type: object, properties: { id: { type: integer }, name: { type: string } } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ExportData:
      type: object
      description: Objeto plano de escalares (texto hasta 200 caracteres, número, booleano o null); hasta 24 campos.
      additionalProperties: { type: [string, number, boolean, "null"] }
    ReportExport:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        username: { type: string }
        report: { type: string, enum: [sales, inventory, receivables, scenario] }
        format: { type: string, enum: [pdf, xlsx] }
        description: { type: string }
        folio: { type: string, example: R-2026-000012 }
        hash: { type: [string, "null"], description: sha256 hexadecimal de report|format|filters|summary|createdAt|userId }
        filters: { $ref: "#/components/schemas/ExportData" }
        summary: { $ref: "#/components/schemas/ExportData" }
        createdAt: { type: string, format: date-time }
        verifyUrl: { type: string, description: Ruta pública de verificación relativa a la API }
    ChatPerson:
      type: object
      properties: { id: { type: integer }, firstName: { type: string }, lastName: { type: string } }
    ChatAttachment:
      type: object
      properties: { id: { type: integer }, name: { type: string }, mime: { type: string }, size: { type: integer }, durationMs: { type: [integer, "null"], description: Solo en notas de voz } }
    ChatMediaItem:
      type: object
      description: Un adjunto (`attachment`) o un enlace del texto (`url`), según `kind`
      properties:
        kind: { type: string, enum: [image, file, audio, link] }
        messageId: { type: integer }
        createdAt: { type: string, format: date-time }
        author: { $ref: "#/components/schemas/ChatPerson" }
        attachment: { $ref: "#/components/schemas/ChatAttachment" }
        url: { type: string }
    ChatMessage:
      type: object
      properties:
        id: { type: integer }
        clientId: { type: [string, "null"], format: uuid }
        userId: { type: integer }
        username: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        recipientId: { type: [integer, "null"], description: "null en el canal general" }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        threadRootId: { type: [integer, "null"], description: "Respuesta dentro de ese hilo" }
        editedAt: { type: [string, "null"], format: date-time }
        deleted: { type: boolean, description: "Eliminado: sin texto ni adjuntos" }
        replyTo:
          type: [object, "null"]
          properties:
            id: { type: integer }
            author: { $ref: "#/components/schemas/ChatPerson" }
            body: { type: string }
            attachments: { type: integer }
            inThread: { type: boolean }
            privateReply: { type: boolean, description: "Cita de #general en una respuesta privada" }
            deleted: { type: boolean }
        thread:
          type: [object, "null"]
          description: Solo en el mensaje que abre un hilo con respuestas
          properties:
            replies: { type: integer }
            unread: { type: integer }
            lastReplyAt: { type: string, format: date-time }
            participants: { type: array, items: { $ref: "#/components/schemas/ChatPerson" } }
        pinned: { type: [object, "null"], properties: { at: { type: string, format: date-time }, by: { type: object, properties: { id: { type: integer }, name: { type: string } } } } }
        mentions: { type: array, items: { allOf: [{ $ref: "#/components/schemas/ChatPerson" }, { type: object, properties: { username: { type: string } } }] } }
        attachments: { type: array, items: { $ref: "#/components/schemas/ChatAttachment" } }
        receipts:
          type: [object, "null"]
          description: Solo en los mensajes propios (las cuentas desactivadas no cuentan)
          properties:
            status: { type: string, enum: [sent, delivered, read, played], description: "`played` solo en mensajes con nota de voz, cuando todos la reprodujeron" }
            total: { type: integer }
            delivered: { type: integer }
            read: { type: integer }
            played: { type: integer }
        unread: { type: boolean, description: "Mensaje ajeno que quien consulta no ha visto" }
        mentionsMe: { type: boolean }
    ChatPage:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ChatMessage" } }
        hasMoreBefore: { type: boolean }
        hasMoreAfter: { type: boolean }
        root: { $ref: "#/components/schemas/ChatMessage" }
    ChatReceiptEntry:
      type: object
      properties:
        user: { allOf: [{ $ref: "#/components/schemas/ChatPerson" }, { type: object, properties: { role: { $ref: "#/components/schemas/Role" }, active: { type: boolean } } }] }
        deliveredAt: { type: [string, "null"], format: date-time }
        readAt: { type: [string, "null"], format: date-time }
        playedAt: { type: [string, "null"], format: date-time, description: Solo en mensajes con nota de voz }
    ChatReceipts:
      type: object
      description: "`read`, `delivered` y `pending` se excluyen entre sí; `played` es un subconjunto de `read` (solo con `audio`)"
      properties:
        messageId: { type: integer }
        status: { type: string, enum: [sent, delivered, read, played] }
        audio: { type: boolean, description: El mensaje lleva una nota de voz }
        read: { type: array, items: { $ref: "#/components/schemas/ChatReceiptEntry" } }
        delivered: { type: array, items: { $ref: "#/components/schemas/ChatReceiptEntry" } }
        pending: { type: array, items: { $ref: "#/components/schemas/ChatReceiptEntry" } }
        played: { type: array, items: { $ref: "#/components/schemas/ChatReceiptEntry" } }
    ChatPreview:
      type: [object, "null"]
      properties:
        body: { type: string }
        createdAt: { type: string, format: date-time }
        mine: { type: boolean }
    ContactMessage:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: [string, "null"] }
        email: { type: [string, "null"] }
        topic: { type: [string, "null"] }
        body: { type: string }
        status: { type: string, enum: [NEW, READ, ARCHIVED] }
        createdAt: { type: string, format: date-time }
    UserPage: { allOf: [{ $ref: "#/components/schemas/Page" }, { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/User" } } } }] }
    CreateUser:
      type: object
      required: [firstName, lastName, username, password, role]
      properties:
        firstName: { type: string, maxLength: 80 }
        lastName: { type: string, maxLength: 80 }
        username: { type: string, minLength: 3, maxLength: 50 }
        password: { type: string, format: password, minLength: 8 }
        role: { $ref: "#/components/schemas/Role" }
    Category:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    CategoryPage: { allOf: [{ $ref: "#/components/schemas/Page" }, { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Category" } } } }] }
    Product:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        sku: { type: string }
        categoryId: { type: integer }
        categoryName: { type: string }
        purchasePrice: { type: number }
        salePrice: { type: number }
        stock: { type: integer }
        availableStock: { type: integer, description: "Unidades de lotes no vencidos (lo que se puede vender hoy)" }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProductPage: { allOf: [{ $ref: "#/components/schemas/Page" }, { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Product" } } } }] }
    CreateProduct:
      type: object
      required: [name, sku, categoryId, purchasePrice, salePrice]
      properties:
        name: { type: string, maxLength: 120 }
        sku: { type: string, maxLength: 40 }
        categoryId: { type: integer }
        purchasePrice: { type: number, minimum: 0, description: Máximo 2 decimales }
        salePrice: { type: number, minimum: 0 }
    UpdateProduct:
      type: object
      properties:
        name: { type: string }
        sku: { type: string }
        categoryId: { type: integer }
        purchasePrice: { type: number }
        salePrice: { type: number }
        active: { type: boolean }
    ProductBatch:
      type: object
      properties:
        id: { type: integer }
        productId: { type: integer }
        productName: { type: string }
        supplierId: { type: [integer, "null"] }
        supplierName: { type: [string, "null"] }
        quantity: { type: integer }
        quantityRemaining: { type: integer }
        unitCost: { type: number }
        expiresAt: { type: string, format: date }
        expired: { type: boolean }
        daysToExpire: { type: integer }
        createdAt: { type: string, format: date-time }
    ProductBatchPage: { allOf: [{ $ref: "#/components/schemas/Page" }, { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/ProductBatch" } } } }] }
    BatchAggregate:
      type: object
      properties:
        batches: { type: integer }
        units: { type: integer }
        costValue: { type: number }
    Supplier:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        taxId: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    SupplierPage: { allOf: [{ $ref: "#/components/schemas/Page" }, { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Supplier" } } } }] }
    CreateSupplier:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }
        taxId: { type: string, maxLength: 30 }
        phone: { type: string, maxLength: 30 }
    UpdateSupplier:
      type: object
      properties:
        name: { type: string }
        taxId: { type: [string, "null"], description: null borra el dato }
        phone: { type: [string, "null"] }
        active: { type: boolean }
    Customer:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        documentId: { type: string }
        phone: { type: [string, "null"] }
        creditLimit: { type: number }
        balance: { type: number, description: Cartera vigente }
        availableCredit: { type: number }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    CustomerPage: { allOf: [{ $ref: "#/components/schemas/Page" }, { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Customer" } } } }] }
    CreateCustomer:
      type: object
      required: [name, documentId]
      properties:
        name: { type: string, maxLength: 120 }
        documentId: { type: string, minLength: 3, maxLength: 30 }
        phone: { type: string, maxLength: 30 }
        creditLimit: { type: number, minimum: 0, default: 0 }
    UpdateCustomer:
      type: object
      properties:
        name: { type: string }
        documentId: { type: string }
        phone: { type: [string, "null"] }
        creditLimit: { type: number }
        active: { type: boolean }
    CustomerBalance:
      type: object
      properties:
        customerId: { type: integer }
        name: { type: string }
        creditLimit: { type: number }
        balance: { type: number }
        availableCredit: { type: number }
        lastCreditSaleAt: { type: [string, "null"], format: date-time }
        lastPaymentAt: { type: [string, "null"], format: date-time }
        overdue: { type: boolean }
        overdueDays: { type: integer }
    CustomerPayment:
      type: object
      properties:
        id: { type: integer }
        customerId: { type: integer }
        userId: { type: integer }
        amount: { type: number }
        balanceAfter: { type: number }
        createdAt: { type: string, format: date-time }
    CreateSale:
      type: object
      required: [lines]
      properties:
        customerId: { type: integer, description: Opcional en contado, obligatorio en crédito }
        paymentType: { type: string, enum: [CASH, CREDIT], default: CASH }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: { type: integer }
              quantity: { type: integer, minimum: 1 }
    Sale:
      type: object
      properties:
        id: { type: integer }
        invoiceNumber: { type: string, example: FV-2026-000001 }
        customerId: { type: [integer, "null"] }
        customerName: { type: [string, "null"] }
        userId: { type: integer }
        username: { type: string }
        paymentType: { type: string, enum: [CASH, CREDIT] }
        total: { type: number }
        status: { type: string, enum: [COMPLETED, VOIDED] }
        voidedAt: { type: [string, "null"], format: date-time }
        voidedBy: { type: [integer, "null"] }
        createdAt: { type: string, format: date-time }
    SaleLine:
      type: object
      properties:
        id: { type: integer }
        productId: { type: integer }
        productName: { type: string }
        sku: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number, description: Precio congelado al momento de la venta }
        lineTotal: { type: number }
    SaleDetail: { allOf: [{ $ref: "#/components/schemas/Sale" }, { type: object, properties: { lines: { type: array, items: { $ref: "#/components/schemas/SaleLine" } } } }] }
    SalePage: { allOf: [{ $ref: "#/components/schemas/Page" }, { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Sale" } } } }] }
    Audit:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        username: { type: string }
        method: { type: string }
        resource: { type: string }
        aiSuggested: { type: boolean, description: Confirmado desde un borrador de Tita }
        entity: { type: [string, "null"], description: Recurso raíz de la ruta (products, customers, sales…) }
        entityId: { type: [integer, "null"], description: Registro tocado (id de la ruta o, en una creación, el de la respuesta) }
        changes: { type: [object, "null"], description: "{ request, response }: cuerpo de la petición sin campos sensibles y resumen escalar de la respuesta", properties: { request: { type: object }, response: { type: object } } }
        createdAt: { type: string, format: date-time }
    AuditPage: { allOf: [{ $ref: "#/components/schemas/Page" }, { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Audit" } } } }] }
    CommentEntity: { type: string, enum: [products, customers, sales, suppliers, batches] }
    CommentAuthor:
      type: object
      properties:
        id: { type: integer }
        firstName: { type: string }
        lastName: { type: string }
        username: { type: string }
        role: { type: string }
    Comment:
      type: object
      properties:
        id: { type: integer }
        entity: { $ref: "#/components/schemas/CommentEntity" }
        entityId: { type: integer }
        body: { type: string }
        author: { $ref: "#/components/schemas/CommentAuthor" }
        replyTo:
          type: [object, "null"]
          description: Comentario al que responde; `excerpt` vacío y `deleted` true si ese comentario se eliminó
          properties:
            id: { type: integer }
            author: { $ref: "#/components/schemas/CommentAuthor" }
            excerpt: { type: string }
            deleted: { type: boolean }
        createdAt: { type: string, format: date-time }
    SensitivityVariable: { type: string, enum: [salesIncrease, inventoryTurnover, tmar] }
    Range:
      type: object
      properties:
        from: { type: number }
        to: { type: number }
        step: { type: number }
    Assumptions:
      type: object
      description: Supuestos base (Tabla 1 del capítulo 5). Todos opcionales al crear; se muestran completos al consultar.
      properties:
        monthlySales: { type: number, example: 65000000 }
        costOfSalesPct: { type: number, example: 0.75 }
        fixedExpensesMonth: { type: number, example: 8500000 }
        baseSalesGrowth: { type: number, example: 0.03 }
        constructionInvestment: { type: number, example: 60000000 }
        equipmentInvestment: { type: number, example: 15000000 }
        salesIncreasePct: { type: number, example: 0.2 }
        additionalFixedExpensesMonth: { type: number, example: 1000000 }
        inventoryTurnover: { type: number, example: 6 }
        creditRateEA: { type: number, example: 0.21 }
        termMonths: { type: integer, example: 48 }
        tmarEA: { type: number, example: 0.18 }
        investorRateEA: { type: number, example: 0.18 }
        horizonYears: { type: integer, example: 5 }
        inflation: { type: number, example: 0.05 }
        salvageValuePct: { type: number, example: 0.3 }
        ownerWithdrawalsMonth: { type: number, example: 0 }
    CreateScenario:
      type: object
      required: [name, fixedInvestment, creditPct, termMonths, salesIncrease, additionalExpensesMonth]
      properties:
        name: { type: string, maxLength: 160, example: "A. Ampliación completa, crédito 100 % a 48 meses" }
        fixedInvestment: { type: number, example: 75000000 }
        creditPct: { type: number, minimum: 0, maximum: 1, example: 1 }
        termMonths: { type: integer, example: 48 }
        salesIncrease: { type: number, example: 0.2 }
        additionalExpensesMonth: { type: number, example: 1000000 }
        creditCoversWorkingCapital: { type: boolean, default: false }
        assumptions: { $ref: "#/components/schemas/Assumptions" }
    ScenarioIndicators:
      type: object
      properties:
        workingCapital: { type: number }
        totalInvestment: { type: number }
        credit: { type: number }
        ownContribution: { type: number }
        installment: { type: number }
        totalInterest: { type: number }
        npv: { type: number }
        irr: { type: [number, "null"] }
        paybackSimple: { type: [number, "null"] }
        paybackDiscounted: { type: [number, "null"] }
        profitabilityIndex: { type: number }
        benefitCostRatio: { type: number }
        investorNpv: { type: number }
        investorIrr: { type: [number, "null"] }
        coverageWithSales: { type: [number, "null"] }
        coverageWithoutSales: { type: [number, "null"] }
        coverageIncremental: { type: [number, "null"] }
        signChanges: { type: integer }
    ScenarioSummary:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        userId: { type: integer }
        username: { type: string }
        fixedInvestment: { type: number }
        creditPct: { type: number }
        termMonths: { type: integer }
        salesIncrease: { type: number }
        additionalExpensesMonth: { type: number }
        creditCoversWorkingCapital: { type: boolean }
        indicators: { $ref: "#/components/schemas/ScenarioIndicators" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ScenarioPage: { allOf: [{ $ref: "#/components/schemas/Page" }, { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/ScenarioSummary" } } } }] }
    CashFlowDetail:
      type: object
      properties:
        year: { type: integer }
        margin: { type: number }
        expenses: { type: number, description: Negativo }
        workingCapitalDelta: { type: number }
        salvage: { type: number }
        workingCapitalRecovery: { type: number }
        flow: { type: number }
    ScenarioDetail:
      allOf:
        - { $ref: "#/components/schemas/ScenarioSummary" }
        - type: object
          properties:
            assumptions: { $ref: "#/components/schemas/Assumptions" }
            results:
              type: object
              description: Resultado completo del motor (sin la tabla de amortización, que tiene su propio endpoint)
              properties:
                flows: { type: array, items: { type: number }, description: "Flujo del proyecto, año 0..H" }
                investorFlows: { type: array, items: { type: number } }
                debtService: { type: array, items: { type: number } }
                detail: { type: array, items: { $ref: "#/components/schemas/CashFlowDetail" } }
    AmortizationRow:
      type: object
      properties:
        month: { type: integer }
        installment: { type: number }
        interest: { type: number }
        principal: { type: number }
        balance: { type: number }

security:
  - bearerAuth: []
